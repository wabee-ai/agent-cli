# GoReleaser configuration for wabee-cli
# See: https://goreleaser.com

version: 2

project_name: wabee

before:
  hooks:
    - go mod tidy

builds:
  - id: wabee
    binary: wabee
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/wabee-ai/wabee-cli/cmd.Version={{.Version}}
      - -X github.com/wabee-ai/wabee-cli/cmd.Commit={{.ShortCommit}}
      - -X github.com/wabee-ai/wabee-cli/cmd.BuildDate={{.Date}}

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

brews:
  - name: wabee
    repository:
      owner: wabee-ai
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    folder: Formula
    homepage: "https://github.com/wabee-ai/wabee-cli"
    description: "CLI for interacting with Wabee AI agents"
    license: "MIT"
    install: |
      bin.install "wabee"
    test: |
      system "#{bin}/wabee", "version"

nfpms:
  - id: packages
    package_name: wabee
    vendor: Wabee AI
    homepage: https://github.com/wabee-ai/wabee-cli
    maintainer: Wabee AI <support@wabee.ai>
    description: CLI for interacting with Wabee AI agents
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin

dockers:
  - image_templates:
      - "wabee/cli:{{ .Tag }}"
      - "wabee/cli:latest"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"

release:
  github:
    owner: wabee-ai
    name: wabee-cli
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} v{{.Version}}"
